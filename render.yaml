services:
  - type: web
    name: nila-botanics-admin
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://nila-botanics-storefront.vercel.app
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SNAPSERVE_API_KEY
        sync: false
      - key: SNAPSERVE_BASE_URL
        value: https://app.snapserve.ai/api
      - key: SNAPSERVE_WEBHOOK_BASE_URL
        sync: false
      - key: SNAPSERVE_AGENT_ID
        sync: false
      - key: SNAPSERVE_CAMPAIGN_WEBHOOK_URL
        sync: false
      - key: SNAPSERVE_CAMPAIGN_WEBHOOK_TOKEN
        sync: false
      - key: SNAPSERVE_WEBHOOK_SECRET
        sync: false
      - key: AUTO_CALL_ON_ORDER
        value: "false"
