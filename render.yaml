services:
  - type: web
    name: nila-botanics-admin
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SNAPSERVE_API_KEY
        sync: false
      - key: SNAPSERVE_CALL_URL
        sync: false
      - key: AUTO_CALL_ON_ORDER
        value: "false"
