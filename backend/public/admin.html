<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nila Botanics — Order Admin</title>
  <link rel="stylesheet" href="/admin/admin.css">
  <style>.integration{margin-bottom:16px;padding:14px 18px;border-radius:8px;background:#fff;border:1px solid #ded8cb;font-size:13px}.integration.ready{border-color:#8eb49f;background:#edf7f1}.integration.warning{border-color:#d6ae6c;background:#fff8e8}.call-details{grid-column:1/-1;border-top:1px solid #ded8cb;padding-top:12px}.call-details summary{cursor:pointer;font-weight:700}.call-details pre{white-space:pre-wrap;background:#f6f1e7;padding:12px;max-height:260px;overflow:auto}.call-details a{text-decoration:underline}.actions button:disabled{opacity:.45;cursor:not-allowed}</style>
</head>
<body>
  <header><div><p>NILA BOTANICS</p><h1>Order administration</h1></div><button id="refresh">Refresh orders</button></header>
  <main>
    <section class="integration" id="integration">Checking SnapServe integration…</section>
    <section class="stats" id="stats"></section>
    <section class="toolbar">
      <input id="search" placeholder="Search order, customer or phone">
      <select id="filter"><option value="all">All statuses</option><option>placed</option><option>confirmed</option><option>packing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select>
      <span id="message"></span>
    </section>
    <section id="orders" class="orders"><p class="empty">Loading orders…</p></section>
  </main>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
