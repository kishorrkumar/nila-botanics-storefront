<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nila Botanics — Order Admin</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header>
    <div><p>NILA BOTANICS</p><h1>Order administration</h1></div>
    <button id="refresh">Refresh data</button>
  </header>
  <main>
    <section class="integration" id="integration">Checking SnapServe integration…</section>
    <p id="message" class="global-message" aria-live="polite"></p>
    <nav class="tabs" aria-label="Admin sections">
      <button class="tab active" data-panel="analytics-panel">Analytics</button>
      <button class="tab" data-panel="orders-panel">Orders</button>
    </nav>

    <section id="analytics-panel" class="panel">
      <div class="section-heading">
        <div><p class="eyebrow">PERFORMANCE</p><h2>Order analytics</h2></div>
        <label>Period
          <select id="analytics-period"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="365">Last year</option></select>
        </label>
      </div>
      <section class="metrics" id="metrics"><p class="empty">Loading analytics…</p></section>
      <div class="analytics-grid">
        <section class="analytics-card trend-card"><div class="card-title"><h3>Sales trend</h3><span>Revenue by day</span></div><div id="sales-chart" class="sales-chart"></div></section>
        <section class="analytics-card"><div class="card-title"><h3>Order status</h3><span>Current distribution</span></div><div id="status-chart"></div></section>
        <section class="analytics-card"><div class="card-title"><h3>Top products</h3><span>By units ordered</span></div><div id="product-table"></div></section>
        <section class="analytics-card"><div class="card-title"><h3>Voice calls</h3><span>SnapServe performance</span></div><div id="call-analytics"></div></section>
      </div>
    </section>

    <section id="orders-panel" class="panel" hidden>
      <section class="stats" id="stats"></section>
      <section class="toolbar">
        <input id="search" placeholder="Search order, customer or phone">
        <select id="filter"><option value="all">All statuses</option><option>placed</option><option>confirmed</option><option>packing</option><option>shipped</option><option>delivered</option><option>cancelled</option></select>
      </section>
      <section id="orders" class="orders"><p class="empty">Loading orders…</p></section>
    </section>
  </main>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
